<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>トップ | 課題管理アプリケーション</title>
</head>
<body>
<h1>課題一覧</h1>
<ul>
    <li>
        <a href="../index.html" th:href="@{/}">トップ</a>
    </li>
    <li>
        <a href="./create.html" th:href="@{/issues/create}">課題作成</a>
    </li>
</ul>
<table>
    <thead>
    <tr>
        <th>#</th>
        <th>概要</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="issue : ${issueList}">
        <th th:text="${issue.id}">(id)</th>
        <th th:text="${issue.summary}">(summary)</th>
    </tr>
    </tbody>
</table>
</body>
</html>
